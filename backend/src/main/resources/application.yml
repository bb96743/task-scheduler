server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: task-scheduler
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

scheduler:
  node-id: ${NODE_ID:node-1}
  scan-interval-ms: 1000
  heartbeat-interval-ms: 5000
  node-timeout-ms: 30000
  compensation-window-days: 7
  executor-pool-size: 8
  retry-scan-interval-ms: 5000

logging:
  level:
    com.intematrix.scheduler: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
